# The full gate runs on the default shell, the current stable Zig. The
# compatibility lane has to compile and pass the suite on the previous one.
jobs:
  - recipe: ci
  - recipe: check
    shell: zig-old
  # Runtime dispatch, which only a generic x86-64 build takes: the tests and
  # the oracle built for the baseline CPU, on an x86-64 runner.
  - recipe: check-dispatch
  # The NEON kernels on the hardware they are for.
  - recipe: check
    runners: [ubuntu-26.04-arm]
  # macOS on aarch64: the NEON kernels under another OS and toolchain. It
  # runs, shows, and never fails CI.
  - recipe: check
    runners: [macos-26]
    blocking: false
