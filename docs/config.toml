# The utf guide, served at baskingspot.dev/utf/. The theme and the site build
# come from baskingspot-docs; the router in baskingspot/site serves /utf/...
base_url = "https://baskingspot.dev/utf"
theme = "baskingspot"
title = "utf"
description = "SIMD Unicode validation and transcoding, plus base64, in Zig with no C."

generate_feeds = false
build_search_index = false

[markdown]
insert_anchor_links = "heading"

[markdown.highlighting]
# An unknown fence language is a build error, not an unhighlighted block.
error_on_missing_language = true
light_theme = "github-light"
dark_theme = "github-dark"

[extra]
repo = "baskingspot/utf"
api = true
third_party = false
